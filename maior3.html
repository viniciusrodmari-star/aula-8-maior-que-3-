<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <title>Maior de três valores</title>
</head>
<body>
    <h2>Maior de três valores</h2>
    <script>
        "use strict";

        // Função que recebe três valores e retorna o maior deles
        function maiorDeTres(a, b, c) {
            let maior = a;
            if (b > maior) {
                maior = b;
            }
            if (c > maior) {
                maior = c;
            }
            return maior;
        }

        // Testes fixos (várias chamadas diferentes)
        document.write("<h3>Testes com valores fixos</h3>");
        document.write(`<p>maiorDeTres(1, 2, 3) = <b>${maiorDeTres(1, 2, 3)}</b></p>`);
        document.write(`<p>maiorDeTres(9, 5, 7) = <b>${maiorDeTres(9, 5, 7)}</b></p>`);
        document.write(`<p>maiorDeTres(4, 8, 2) = <b>${maiorDeTres(4, 8, 2)}</b></p>`);
        document.write(`<p>maiorDeTres(-1, -5, -3) = <b>${maiorDeTres(-1, -5, -3)}</b></p>`);
        document.write(`<p>maiorDeTres(6, 6, 6) = <b>${maiorDeTres(6, 6, 6)}</b></p>`);

        // Testes com dados digitados pelo usuário
        document.write("<h3>Testes com valores digitados</h3>");
        let continuar = true;
        while (continuar) {
            let x = parseFloat(prompt("Digite o 1º valor:"));
            let y = parseFloat(prompt("Digite o 2º valor:"));
            let z = parseFloat(prompt("Digite o 3º valor:"));

            if (isNaN(x) || isNaN(y) || isNaN(z)) {
                document.write("<p style='color:red'>Algum valor digitado não é um número.</p>");
            } else {
                document.write(`<p>Valores: ${x}, ${y}, ${z} → maior = <b>${maiorDeTres(x, y, z)}</b></p>`);
            }

            continuar = confirm("Deseja testar outros valores?");
        }
    </script>
</body>
</html>
